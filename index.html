
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .wrap {
    min-height: 100vh;
    background: linear-gradient(160deg, #e8f5d0 0%, #fff8e7 50%, #fdebd0 100%);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 28px 16px;
  }
  .card {
    background: #fffef6;
    border-radius: 24px;
    padding: 28px 24px;
    width: 100%; max-width: 480px;
    border: 2px solid #d4e8a0;
    box-shadow: 0 4px 24px rgba(100,140,40,0.10);
  }
  .app-header { text-align: center; margin-bottom: 24px; }
  .app-header .emoji { font-size: 36px; display: block; margin-bottom: 4px; }
  .app-header h1 { font-size: 20px; font-weight: 700; color: #3a6b1a; letter-spacing: -0.3px; }
  .app-header p { font-size: 13px; color: #7a9a50; margin-top: 2px; }

  .step-bar { display: flex; align-items: center; margin-bottom: 24px; }
  .step-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; transition: all 0.2s; }
  .step-dot.active { background: #5a9e2f; color: #fff; box-shadow: 0 2px 8px rgba(90,158,47,0.35); }
  .step-dot.done { background: #c8e89a; color: #3a6b1a; }
  .step-dot.idle { background: #eef3e2; color: #aab87a; }
  .step-line { flex: 1; height: 2px; background: #ddeebb; }
  .step-line.filled { background: #5a9e2f; }

  .section-title { font-size: 17px; font-weight: 700; color: #3a6b1a; margin-bottom: 18px; }

  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 13px; color: #6b8c3a; margin-bottom: 6px; font-weight: 600; }
  .field input { width: 100%; padding: 12px 14px; border: 1.5px solid #c8dfa0; border-radius: 12px; font-size: 16px; outline: none; background: #f8fdf0; color: #2d4a10; transition: border 0.2s; }
  .field input:focus { border-color: #5a9e2f; background: #fff; }
  .prefix-wrap { position: relative; }
  .prefix-wrap .sym { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #8aaa55; font-size: 15px; pointer-events: none; font-weight: 600; }
  .prefix-wrap input { padding-left: 28px; }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

  .btn-primary { width: 100%; padding: 14px; border-radius: 14px; background: #5a9e2f; color: #fff; border: none; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; letter-spacing: 0.2px; box-shadow: 0 3px 10px rgba(90,158,47,0.3); transition: background 0.2s; }
  .btn-primary:hover { background: #3a7a18; }
  .btn-ghost { width: 100%; padding: 12px; border-radius: 12px; background: transparent; border: 1.5px solid #c8dfa0; font-size: 15px; cursor: pointer; color: #6b8c3a; margin-top: 10px; font-weight: 500; transition: background 0.2s; }
  .btn-ghost:hover { background: #f0f8e0; }
  .btn-sm { padding: 8px 14px; border-radius: 10px; background: #f0f8e0; border: 1.5px solid #c8dfa0; font-size: 13px; cursor: pointer; color: #4a7a22; font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .btn-sm:hover { background: #dff0c0; }

  .name-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .name-grid input { width: 100%; padding: 11px 12px; border: 1.5px solid #c8dfa0; border-radius: 12px; font-size: 15px; outline: none; background: #f8fdf0; color: #2d4a10; }
  .name-grid input:focus { border-color: #5a9e2f; background: #fff; }

  .error { font-size: 13px; color: #c0392b; margin-top: 6px; }
  .page { display: none; }
  .page.active { display: block; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .chip { background: #eef8d8; border: 1px solid #c8dfa0; border-radius: 20px; padding: 5px 14px; font-size: 13px; color: #4a7a22; }
  .chip b { color: #2d5a10; font-weight: 700; }

  .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

  .alloc-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eef3e2; }
  .alloc-row:last-child { border-bottom: none; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; border: 2px solid rgba(0,0,0,0.06); }
  .alloc-name { flex: 1; font-size: 15px; font-weight: 600; color: #2d4a10; display: flex; align-items: center; gap: 6px; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px; }
  .badge.top { background: #c8f0a8; color: #2a6010; }
  .badge.low { background: #fde8c8; color: #a04010; }
  .bar-wrap { width: 72px; height: 7px; background: #eef3e2; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .alloc-amt { font-size: 15px; font-weight: 700; color: #2d5a10; min-width: 52px; text-align: right; }

  .total-row { display: flex; justify-content: space-between; padding: 14px 0 4px; font-size: 15px; border-top: 1.5px dashed #c8dfa0; margin-top: 4px; }
  .total-row span:first-child { color: #7a9a50; font-weight: 500; }
  .total-row span:last-child { font-weight: 700; color: #3a7a18; font-size: 17px; }

  .divider { height: 1.5px; background: linear-gradient(90deg, transparent, #c8dfa0, transparent); margin: 18px 0; }
</style>

<div class="wrap">
  <div class="card">
    <div class="app-header">
      <span class="emoji">🧺</span>
      <h1>Picnic Money Allocator</h1>
      <p>Split the budget for your outdoor feast</p>
    </div>

    <div class="step-bar" id="stepBar">
      <div class="step-dot active" id="s1">1</div>
      <div class="step-line" id="l1"></div>
      <div class="step-dot idle" id="s2">2</div>
      <div class="step-line" id="l2"></div>
      <div class="step-dot idle" id="s3">✓</div>
    </div>

    <div class="page active" id="page1">
      <p class="section-title">🌿 Budget details</p>
      <div class="field">
        <label>Total amount</label>
        <div class="prefix-wrap"><span class="sym">$</span><input type="number" id="total" placeholder="e.g. 200"></div>
      </div>
      <div class="field">
        <label>Number of people</label>
        <input type="number" id="people" placeholder="e.g. 4" style="width:100%;padding:12px 14px;border:1.5px solid #c8dfa0;border-radius:12px;font-size:16px;outline:none;background:#f8fdf0;color:#2d4a10;">
      </div>
      <div class="field">
        <label>Minimum per person</label>
        <div class="prefix-wrap"><span class="sym">$</span><input type="number" id="minimum" placeholder="e.g. 10"></div>
      </div>
      <div id="err1" class="error"></div>
      <button class="btn-primary" onclick="goToNames()">Next 🌻</button>
    </div>

    <div class="page" id="page2">
      <p class="section-title">🐝 Who's joining?</p>
      <div id="nameGrid" class="name-grid"></div>
      <div id="err2" class="error"></div>
      <button class="btn-primary" onclick="allocate()">🎉 Allocate!</button>
      <button class="btn-ghost" onclick="goBack()">← Back</button>
    </div>

    <div class="page" id="page3">
      <div class="results-header">
        <p class="section-title" style="margin:0">🍉 Results</p>
        <button class="btn-sm" onclick="reshuffle()">⟳ Reshuffle</button>
      </div>
      <div id="chips" class="chips"></div>
      <div id="allocList"></div>
      <div class="total-row">
        <span>Total allocated</span>
        <span id="totalOut"></span>
      </div>
      <button class="btn-ghost" onclick="startOver()" style="margin-top:16px;font-size:14px">🏠 Start over</button>
    </div>
  </div>
</div>

<script>
  let state = {};
  const avatarStyles = [
    { bg: '#d4f0a0', color: '#2d6010' },
    { bg: '#fde8b0', color: '#8a4f10' },
    { bg: '#ffc8a0', color: '#8a3010' },
    { bg: '#c8e8f8', color: '#1a5a8a' },
    { bg: '#e8c8f8', color: '#5a2a8a' },
    { bg: '#f8d0c8', color: '#8a2a2a' },
  ];

  function goToNames() {
    const total = parseFloat(document.getElementById('total').value);
    const people = parseInt(document.getElementById('people').value);
    const minimum = parseFloat(document.getElementById('minimum').value) || 0;
    const err = document.getElementById('err1');
    if (!total || total <= 0) { err.textContent = 'Please enter a valid total amount.'; return; }
    if (!people || people < 1 || people > 20) { err.textContent = 'Enter between 1 and 20 people.'; return; }
    if (minimum * people > total) { err.textContent = `Min total ($${minimum * people}) exceeds budget ($${total}).`; return; }
    err.textContent = '';
    state = { total, people, minimum };
    buildNameGrid(people);
    setPage(2);
  }

  function buildNameGrid(n) {
    const grid = document.getElementById('nameGrid');
    grid.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = `Person ${i + 1}`;
      inp.className = 'personName';
      grid.appendChild(inp);
    }
  }

  function allocate() {
    const names = [...document.querySelectorAll('.personName')].map((el, i) => el.value.trim() || `Person ${i + 1}`);
    state.names = names;
    doAllocate();
    setPage(3);
  }

  function doAllocate() {
    const { total, people, minimum, names } = state;
    const min = minimum || 0;
    const pool = total - min * people;
    let weights = Array.from({ length: people }, () => -Math.log(Math.random() + 0.0001));
    const wSum = weights.reduce((a, b) => a + b, 0);
    let allocs = weights.map(w => min + Math.floor((w / wSum) * pool));
    let leftover = total - allocs.reduce((a, b) => a + b, 0);
    while (leftover > 0) { allocs[Math.floor(Math.random() * people)]++; leftover--; }
    for (let i = allocs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [allocs[i], allocs[j]] = [allocs[j], allocs[i]];
    }
    state.allocs = allocs;

    const max = Math.max(...allocs), minVal = Math.min(...allocs);
    document.getElementById('chips').innerHTML =
      `<div class="chip">💰 Total <b>$${total}</b></div><div class="chip">👥 ${people} people</div><div class="chip">📊 Spread <b>$${max - minVal}</b></div>`;

    document.getElementById('allocList').innerHTML = names.map((name, i) => {
      const c = avatarStyles[i % avatarStyles.length];
      const initials = name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
      const pct = max > minVal ? Math.round(((allocs[i] - minVal) / (max - minVal)) * 100) : 100;
      const isTop = allocs[i] === max, isLow = allocs[i] === minVal;
      const barColor = isTop ? '#5a9e2f' : isLow ? '#e87830' : '#60a8d8';
      const badge = isTop ? '<span class="badge top">🌟 top</span>' : isLow ? '<span class="badge low">🍂 low</span>' : '';
      return `<div class="alloc-row">
        <div class="avatar" style="background:${c.bg};color:${c.color}">${initials}</div>
        <div class="alloc-name">${name}${badge}</div>
        <div class="bar-wrap"><div class="bar-fill" style="width:${Math.max(pct,5)}%;background:${barColor}"></div></div>
        <div class="alloc-amt">$${allocs[i]}</div>
      </div>`;
    }).join('');

    document.getElementById('totalOut').textContent = `$${allocs.reduce((a, b) => a + b, 0)}`;
  }

  function reshuffle() { doAllocate(); }
  function goBack() { setPage(1); }
  function startOver() {
    ['total','people','minimum'].forEach(id => document.getElementById(id).value = '');
    state = {};
    setPage(1);
  }

  function setPage(n) {
    [1,2,3].forEach(i => document.getElementById(`page${i}`).classList.toggle('active', i === n));
    [1,2,3].forEach(i => {
      const dot = document.getElementById(`s${i}`);
      dot.className = 'step-dot ' + (i < n ? 'done' : i === n ? 'active' : 'idle');
      dot.textContent = i < n ? '✓' : i === 3 ? '✓' : i;
    });
    document.getElementById('l1').className = 'step-line' + (n > 1 ? ' filled' : '');
    document.getElementById('l2').className = 'step-line' + (n > 2 ? ' filled' : '');
  }
</script>
